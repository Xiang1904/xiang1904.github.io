<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易記帳 | 莊凱翔期末專題</title>
    <link rel="stylesheet" href="expense.css" />
  </head>
  <body>
    <main class="expense-shell">
      <section class="expense-header">
        <div class="header-content">
          <p class="eyebrow">Expense Tracker</p>
          <h1>簡易記帳</h1>
          <p>登入後即可記錄收入與支出，所有資料都會同步到 Firebase。</p>
          <a href="index.html" class="back-link">回首頁</a>
        </div>
      </section>

      <section class="expense-layout">
        <aside class="side-panel">
          <section class="auth-panel" aria-label="會員登入">
            <div class="auth-tabs">
              <button id="login-tab" class="tab-button active" type="button">登入</button>
              <button id="register-tab" class="tab-button" type="button">註冊</button>
            </div>

            <form id="auth-form" class="auth-form">
              <label>
                帳號
                <input id="auth-username" name="username" type="text" autocomplete="username" maxlength="30" required />
              </label>
              <label>
                密碼
                <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="40" required />
              </label>
              <button id="auth-submit" type="submit">登入</button>
              <p id="auth-status" role="status"></p>
            </form>

            <div id="user-panel" class="user-panel hidden">
              <span>目前登入</span>
              <strong id="current-user"></strong>
              <button id="logout-button" type="button">登出</button>
            </div>
          </section>

          <section class="expense-form-panel">
            <h2>新增記錄</h2>
            <form id="expense-form" class="expense-form locked">
              <div class="form-group">
                <label for="expense-date">日期</label>
                <input type="date" id="expense-date" required />
              </div>

              <div class="form-group">
                <label for="expense-type">類型</label>
                <select id="expense-type" required>
                  <option value="">選擇類型</option>
                  <option value="income">收入</option>
                  <option value="expense">支出</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expense-category">分類</label>
                <select id="expense-category" required>
                  <option value="">選擇分類</option>
                  <option value="salary">薪資</option>
                  <option value="food">飲食</option>
                  <option value="transport">交通</option>
                  <option value="shopping">購物</option>
                  <option value="entertainment">娛樂</option>
                  <option value="other">其他</option>
                </select>
              </div>

              <div class="form-group">
                <label for="expense-amount">金額</label>
                <input type="number" id="expense-amount" placeholder="0" min="0" step="1" required />
              </div>

              <div class="form-group">
                <label for="expense-note">備註</label>
                <input type="text" id="expense-note" placeholder="例如：午餐、薪水" maxlength="50" />
              </div>

              <label class="checkbox-row">
                <input type="checkbox" id="expense-fixed" />
                <span>固定支出</span>
              </label>

              <button type="submit" class="submit-btn">新增記錄</button>
              <p id="expense-status" role="status">請先登入帳號才能新增記帳資料。</p>
            </form>
          </section>
        </aside>

        <section class="expense-main-panel">
          <section class="expense-summary" aria-label="本月統計">
            <div class="summary-card income">
              <span>收入</span>
              <strong id="summary-income">$0</strong>
            </div>
            <div class="summary-card expense">
              <span>支出</span>
              <strong id="summary-expense">$0</strong>
            </div>
            <div class="summary-card balance">
              <span>結餘</span>
              <strong id="summary-balance">$0</strong>
            </div>
          </section>

          <section class="insight-panel" aria-label="理財概覽">
            <div class="insight-card accent">
              <span>本週花費</span>
              <strong id="weekly-total">$0</strong>
              <p>最近 7 天的支出總額</p>
            </div>
            <div class="insight-card">
              <span>每月固定支出</span>
              <strong id="fixed-total">$0</strong>
              <p>有標記為固定支出的項目</p>
            </div>
          </section>

          <section class="weekly-chart-panel" aria-label="每週花費圖表">
            <div class="section-title-row">
              <h2>每週花費</h2>
              <span>最近 7 天</span>
            </div>
            <div id="weekly-chart" class="weekly-chart"></div>
          </section>

          <section class="fixed-expense-panel" aria-label="每月固定支出">
            <div class="section-title-row">
              <h2>每月固定支出</h2>
              <span>固定支出清單</span>
            </div>
            <div id="fixed-expense-list" class="fixed-expense-list">
              <p class="empty-message">目前還沒有固定支出。</p>
            </div>
          </section>

          <div class="expense-filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="income">收入</button>
            <button class="filter-btn" data-filter="expense">支出</button>
          </div>

          <section class="expense-list-panel" aria-label="記帳列表">
            <h2>我的記帳紀錄</h2>
            <div id="expense-list" class="expense-list">
              <p class="empty-message">登入後就可以開始新增記錄。</p>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script type="module" src="expense.js"></script>
  </body>
</html>
