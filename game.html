<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡易記帳 | 莊凱翔期末專題</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="expense-shell">
      <section class="expense-header">
        <div class="header-content">
          <p class="eyebrow">Budget App</p>
          <h1>簡易記帳</h1>
          <p>快速記錄日常收支，輕鬆掌握開銷。</p>
          <a href="index.html" class="back-link">回首頁</a>
        </div>
      </section>

      <section class="expense-layout">
        <!-- 左側：輸入表單 -->
        <div class="expense-form-panel">
          <h2>新增項目</h2>
          <form id="expense-form" class="expense-form">
            <div class="form-group">
              <label for="expense-date">日期</label>
              <input type="date" id="expense-date" required />
            </div>

            <div class="form-group">
              <label for="expense-category">分類</label>
              <select id="expense-category" required>
                <option value="">選擇分類</option>
                <option value="income">收入</option>
                <option value="food">飲食</option>
                <option value="transport">交通</option>
                <option value="shopping">購物</option>
                <option value="entertainment">娛樂</option>
                <option value="other">其他</option>
              </select>
            </div>

            <div class="form-group">
              <label for="expense-amount">金額</label>
              <input type="number" id="expense-amount" placeholder="0" min="0" step="0.01" required />
            </div>

            <div class="form-group">
              <label for="expense-description">說明</label>
              <input type="text" id="expense-description" placeholder="記錄項目說明" maxlength="50" />
            </div>

            <button type="submit" class="submit-btn">新增</button>
          </form>
        </div>

        <!-- 右側：統計和列表 -->
        <div class="expense-main-panel">
          <!-- 統計卡片 -->
          <section class="expense-summary" aria-label="本月統計">
            <div class="summary-card income">
              <span>收入</span>
              <strong id="summary-income">$0</strong>
            </div>
            <div class="summary-card expense">
              <span>支出</span>
              <strong id="summary-expense">$0</strong>
            </div>
            <div class="summary-card balance">
              <span>結餘</span>
              <strong id="summary-balance">$0</strong>
            </div>
          </section>

          <!-- 篩選 -->
          <div class="expense-filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="income">收入</button>
            <button class="filter-btn" data-filter="expense">支出</button>
          </div>

          <!-- 記錄列表 -->
          <section class="expense-list-panel" aria-label="記帳列表">
            <h2>記帳紀錄</h2>
            <div id="expense-list" class="expense-list">
              <p class="empty-message">還沒有記帳紀錄</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
